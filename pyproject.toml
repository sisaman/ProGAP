[project]
name = "gnnprivtool"
version = "0.1.0"
description = "Progressive Graph Neural Networks with Differential Privacy Guarantees"
requires-python = "==3.10.*"
dependencies = [
    "autodp==0.2.3.1",
    "class-resolver==0.4.0",
    "dask[distributed]==2023.3.1",
    "dask-jobqueue==0.8.1",
    "dp-accounting==0.4.3",
    "ipykernel==6.22.0",
    "matplotlib==3.7.1",
    "numpy==1.24.2",
    "ogb==1.3.5",
    "opacus==1.1.3",
    "pandas==1.5.3",
    "pyg-lib==0.2.0+pt20cu118",
    "pyyaml==6.0",
    "rich==13.3.2",
    "scikit-learn==1.2.2",
    "scipy==1.9.3",
    "seaborn==0.12.2",
    "tabulate==0.9.0",
    "torch==2.0.0",
    "torch-geometric==2.3.0",
    "torch-scatter==2.1.1",
    "torch-sparse==0.6.17",
    "torchmetrics==0.11.4",
    "tqdm==4.65.0",
    "typing-extensions==4.5.0",
    "wandb==0.14.0",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pyg"
url = "https://data.pyg.org/whl/torch-2.0.0+cu118.html"
explicit = true
format = "flat"

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
pyg-lib = { index = "pyg" }
torch-scatter = { index = "pyg" }
torch-sparse = { index = "pyg" }
